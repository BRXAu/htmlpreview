<html>
		<style>
			
			/* Added relative positioning to anchor the absolute child divs */
			.hop0069_background {
				background: #000;
				position: relative; 
				width: 137px;
				height: 137px;
			}

			.hop0069_container {
				display: block;
				width: 137px;
				height: 137px;
				background: #002855;
			}

			/* Changed to absolute positioning to allow overlapping stacking */
			.hop0069_svg_container {
				position: absolute;
				top: 0px;
				left: 0px;
				display: block;
				width: 137px;
				height: 137px;
			}

			/* Explicitly forces the top layer above the bottom layer */
			#bottom {
				z-index: 1;
			}
			#top {
				z-index: 2;
			}

		#top {
  animation: slideDown 0.8s ease-out forwards; 
}

#bottom {
  animation: slideUp 0.8s ease-out forwards; 
}

@keyframes slideDown {
  0% {
    opacity: 1;
    transform: translateY(-150px); /* Starts 50px above its natural position */
  }
  100% {
    opacity: 1;
    transform: translateY(0px);     /* Ends at its natural position */
  }
}
  @keyframes slideUp {
  0% {
    opacity: 1;
    transform: translateY(150px); /* Starts 50px above its natural position */
  }
  100% {
    opacity: 1;
    transform: translateY(0px);     /* Ends at its natural position */
  }
}

		</style>
			<div class="hop0069_background">
				<div id="bottom" class="hop0069_svg_container">
					<svg width="137" height="137" viewBox="0 0 137 137" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path id="hop0069_icon_bottom" d="M121.391 52.8222L68.5918 105.722L47.1559 84.2447L15.919 84.2267L68.5918 137L137 68.4614L121.391 52.8222Z" fill="#F5EB00"/>
					</svg>
				</div>
				<div id="top" class="hop0069_svg_container">
					<svg width="137" height="137" viewBox="0 0 137 137" fill="none" xmlns="http://www.w3.org/2000/svg">
						<path id="hop0069_icon_top" d="M68.4912 31.2784L90.1996 53.0075L121.322 52.8814L68.4912 0L0 68.5386L15.6423 84.1778L68.4912 31.2784Z" fill="#FFFFFF"/>
					</svg>
				</div>
			</div>
</html>
