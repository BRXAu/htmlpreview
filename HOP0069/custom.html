<!DOCTYPE html>
<html>
<head>
	<style> 	

		.frame {
			background: #000000;
		}		 
		:root {
			/* Dimensions */
			--canvas-size: 137px;
			--slide-distance: 150px;

			/* Colors */
			--bg-color: none;
			--shape-top-color: #FFFFFF;
			--shape-bottom-color: #F5EB00;

			/* Animations */
			--anim-duration: 10s;
			--anim-timing: linear;

			--ymove-down-01: -200px;
			--ymove-down-02: -40px;
			--ymove-down-03: -5px;

			--ymove-up-01: 200px;
		--ymove-up-02: 28px;
		--ymove-up-03: 5px;


		}

		.hop0069_background { 
			top: 300px;
			position: relative;  
			width: var(--canvas-size); 
			height: var(--canvas-size); 
			background: var(--bg-color);
		}  

		.hop0069_shape_container { 
			position: absolute; 
			top: 0px; 
			left: 0px; 
			display: block; 
			width: var(--canvas-size); 
			height: var(--canvas-size); 
		}  

		#bottom { 
			z-index: 1; 
			background-color: var(--shape-bottom-color);
			clip-path: polygon(88.61% 38.56%, 50.07% 77.17%, 34.42% 61.49%, 11.62% 61.48%, 50.07% 100%, 100% 49.97%, 88.61% 38.56%);
		} 
		
		#top { 
			z-index: 2; 
			background-color: var(--shape-top-color);
			clip-path: polygon(49.99% 22.83%, 65.84% 38.69%, 88.56% 38.6%, 49.99% 0%, 0% 50.03%, 11.42% 61.44%, 49.99% 22.83%);
		}  

		/* Animation Triggers */
		.frame:not(.dd-cloak) #top {   
			animation: slideDown var(--anim-duration) var(--anim-timing) forwards;  
		}  
		.frame:not(.dd-cloak) #bottom {   
			animation: slideUp var(--anim-duration) var(--anim-timing) forwards;  
		}  




		@keyframes slideDown {   
			0% {
    opacity: 0;
    transform: translateX(0px) translateY(var(--ymove-down-01));
  }
  15% {
  	opacity: 0;
    transform: translateX(0px) translateY(var(--ymove-down-01));
  }
  18% {
  	
    opacity: 0;
  }
  20% {
  	
    transform: translateX(0px) translateY(var(--ymove-down-02));
  }
  22% {
    transform: translateX(0px) translateY(0px);
  }
  23.4% {
  	opacity: 1;
    transform: translateX(0px) translateY(var(--ymove-down-03));
  }
  25% {
    transform: translateX(0px) translateY(0px);
  }
  100% {
    transform: translateX(0px) translateY(0px);
  }
		}   
		



		@keyframes slideUp {   

			0% {
    opacity: 0;
    transform: translateX(0px) translateY(var(--ymove-up-01));
  }
  15% {
    opacity: 0;
    transform: translateX(0px) translateY(var(--ymove-up-01));
  }
  18% {
  	
    opacity: 0;
  }
  20% {
    transform: translateX(0px) translateY(var(--ymove-up-02));
  }
  22% {
    transform: translateX(0px) translateY(0px);
  }
  23.4% {
  	opacity: 1;
    transform: translateX(0px) translateY(var(--ymove-up-03));
  }
  25% {
    transform: translateX(0px) translateY(0px);
  }
  100% {
    transform: translateX(0px) translateY(0px);
  }
		}  
	</style> 
</head>
<body class="frame"> 
	<div class="hop0069_background"> 
		<div id="bottom" class="hop0069_shape_container"></div> 
		<div id="top" class="hop0069_shape_container"></div> 
	</div> 
</body>
</html>
