<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Banner preview</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
h1 { margin-bottom:20px; }

.controls { margin-bottom:20px; }

.controls button {
  margin-right:10px; padding:6px 12px; cursor:pointer;
  border:none; background:#ffcc00; border-radius:4px; font-weight:bold;
}

.container { display:flex; flex-wrap:wrap; gap:20px; }

.banner {
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#222;
  padding:10px;
  border-radius:6px;
}

.foldername {
  font-size:12px;
  color:#aaa;
  margin-bottom:6px;
  word-break:break-all;
  text-align:center;
}

iframe { border:1px solid #444; display:block; }

.banner button {
  margin-top:6px;
  padding:4px 10px;
  cursor:pointer;
  border:none;
  background:#ffcc00;
  border-radius:4px;
}
</style>
</head>
<body>

<h1>Banner preview</h1>
<div class="controls" id="controls"></div>
<div class="container" id="container"></div>

<script>
const prefix = [
  "TBA0450_Desalination_",
];

const sizes = ["300x600","160x600","300x400","320x480","300x250","320x100","320x50","300x50","728x90","900x500","970x250","970x90"];
const defaultsizes = ["300x400","900x500","970x90"];

const exempt = [  ]

function isExempt(str) {
  return exempt.includes(str);
}

const sets = {
  all: [],
  bySize: {},
  defaultsize: [],
};

for (let s = 0; s < sizes.length; s++) {
  sets.bySize[sizes[s]] = [];
}

for (let i = 0; i < prefix.length; i++) {
  for (let j = 0; j < sizes.length; j++) {

    const file = prefix[i] + sizes[j] + "_ClickTag.html";

    const obj = {
      name: file,
      prefix: prefix[i],
      size: sizes[j]
    };

    sets.all.push(obj);
    if(defaultsizes.includes(sizes[j])){
      sets.defaultsize.push(obj);
    }
    
    sets.bySize[sizes[j]].push(obj);
  }
}



const controls = document.getElementById("controls");

const allBtn = document.createElement("button");
allBtn.textContent = "All";
allBtn.onclick = () => loadSet("all");
controls.appendChild(allBtn);


const newBtn = document.createElement("button");
newBtn.textContent = "New";
newBtn.onclick = () => loadSet("defaultsize");
controls.appendChild(newBtn);

for (let i = 0; i < sizes.length; i++) {
  const btn = document.createElement("button");
  btn.textContent = sizes[i];
  btn.onclick = () => loadSet(sizes[i]);
  controls.appendChild(btn);
}

function loadSet(key) {

  const container = document.getElementById("container");
  container.innerHTML = "";

  // const data = key === "all" ? sets.all : sets.bySize[key];
  // const data = key === "all" ? sets.all : key === "defaultsize" ? sets.defaultSize : sets.bySize[key];


  let data;

if (key === "all") {
  data = sets.all;
} else if (key === "defaultsize") {
  data = sets.defaultsize;
} else {
  data = sets.bySize[key];
}
  // third option key == "defaultsize"

  console.log(key)
  console.log(data)
  console.log(sets)

  data.forEach(item => {

    const [w,h] = item.size.split("x");

    const wrap = document.createElement("div");
    wrap.className = "banner";

    const folderName = item.prefix;

    let title = item.prefix + item.size


      wrap.innerHTML = `
        <div class="foldername">${title}</div>
        <iframe src="${item.name}" width="${w}" height="${h}"></iframe>
        <button onclick="this.previousElementSibling.src='${item.name}'">Reload</button>
      `;

      if(isExempt(String(item.name))){
        console.log('exempt')
      }
      else {
        container.appendChild(wrap);
      }

      

  });
}

// default load
// loadSet("defaultsize");
loadSet("all");
</script>

</body>
</html>
