<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>SVG Preview</title> <style> html,body { margin: 0; height: 100%; } body { display: grid; place-items: center; background: #eee; font: 14px Arial,sans-serif; } main { display: grid; gap: 12px; justify-items: center; } object { display: block; width: 600px; height: 500px; background: #fff; } button { padding: 8px 16px; cursor: pointer; } </style> </head> <body> <main> <object id="preview" type="image/svg+xml" data="timer-animate.svg"></object> <button type="button" onclick="refresh()">Refresh</button> </main> <script> function refresh() { const preview = document.getElementById("preview"); preview.data = `timer-animate.svg?t=${Date.now()}`; } </script> </body> </html>
